services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegisnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisnet_password}
      POSTGRES_DB: ${POSTGRES_DB:-aegisnet}
    ports:
      # Use port 5433 on host to avoid conflict with existing host PostgreSQL instances
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisnet} -d ${POSTGRES_DB:-aegisnet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegisnet-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisnet-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegisnet}:${POSTGRES_PASSWORD:-aegisnet_password}@postgres:5432/${POSTGRES_DB:-aegisnet}
      JWT_SECRET: ${JWT_SECRET:-aegisnet-super-secure-production-jwt-key-change-me}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    ports:
      # Map host 8001 to container 8000 (avoids host Splunk port 8000 conflict)
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - aegisnet_data:/app/data
    networks:
      - aegisnet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisnet-frontend
    restart: unless-stopped
    ports:
      # Default to standard HTTP port 80 (accessible directly via http://<server-ip> or domain)
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aegisnet-network

volumes:
  postgres_data:
    driver: local
  aegisnet_data:
    driver: local

networks:
  aegisnet-network:
    driver: bridge
